<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PGY Exam｜登入測試</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 480px;
      margin: 40px auto;
      padding: 20px;
      background: #f4f7f8;
    }
    h2 { color: #176b68; }
    input, button {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 6px;
      background: #176b68;
      color: white;
      cursor: pointer;
    }
    #message {
      margin-top: 16px;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
  </style>
</head>
<body>
  <h2>PGY 三階段筆試｜登入測試</h2>

  <input id="email" type="email" placeholder="測試 Email">
  <input id="password" type="password" placeholder="測試密碼（至少 8 碼）">

  <button onclick="signUp()">註冊測試帳號</button>
  <button onclick="signIn()">登入</button>
  <button onclick="signOut()">登出</button>

  <div id="message">尚未登入</div>

  <script>
    const SUPABASE_URL = "https://mxdkywwaadjqyuvjnfws.supabase.co";
    const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_LyAKEFqnBebsOG-qAn9tKw_wOxLfae9";

    const supabaseClient = supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    const message = document.getElementById("message");

    function getInput() {
      return {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      };
    }

    async function signUp() {
  const { email, password } = getInput();

  // 先確認 Email 和密碼都有取得
  if (!email || !password) {
    message.textContent =
      "請確認 Email 和密碼欄位都有填寫。";
    return;
  }

  if (password.length < 8) {
    message.textContent =
      "測試密碼至少需要 8 碼。";
    return;
  }

  message.textContent = "正在註冊，請稍候……";

  const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
      emailRedirectTo: window.location.href
    }
  });

  if (error) {
    message.textContent = "註冊失敗：" + error.message;
    return;
  }

  message.textContent =
    "註冊請求已送出！\n" +
    "Email：" + email + "\n" +
    "User ID：" + (data.user?.id || "尚未取得") +
    "\n請查看 Email 是否收到驗證信。";
}

    async function signOut() {
      const { error } = await supabaseClient.auth.signOut();

      message.textContent = error
        ? "登出失敗：" + error.message
        : "已登出";
    }

    async function checkSession() {
      const { data } = await supabaseClient.auth.getSession();

      if (data.session) {
        message.textContent =
          "目前已登入\n" +
          "Email：" + data.session.user.email;
      }
    }

    checkSession();
  </script>
</body>
</html>
